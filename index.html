  <style>
    :root {
      --page-width: 460px;
      --paper: #f2efe8;
      --ink: #20211d;
      --muted: #77766f;
      --sage: #798071;
      --bronze: #9a765a;
      --line: color-mix(in srgb, var(--ink) 16%, transparent);
      --serif: Georgia, 'Times New Roman', 'Noto Serif KR', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      background: #d8d3c8;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: #d8d3c8;
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.75;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
    }

    body.is-intro-open {
      overflow: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    .button,
    .nav-link {
      min-height: 44px;
    }

    button {
      color: inherit;
      font: inherit;
    }

    a {
      color: inherit;
      text-underline-offset: 0.22em;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    :focus-visible {
      outline: 3px solid var(--bronze);
      outline-offset: 4px;
    }

    .invitation-page {
      position: relative;
      width: 100%;
      max-width: var(--page-width);
      margin: 0 auto;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 12% 18%, rgb(255 255 255 / 44%) 0 0.8px, transparent 1px),
        radial-gradient(circle at 82% 64%, rgb(32 33 29 / 6%) 0 0.7px, transparent 1px),
        linear-gradient(115deg, rgb(255 255 255 / 12%), transparent 44%, rgb(154 118 90 / 4%));
      background-size: 13px 17px, 19px 23px, 100% 100%;
      isolation: isolate;
    }

    .invitation-page:focus {
      outline: none;
    }

    .intro {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: center;
      color: #f5f1e8;
      background:
        radial-gradient(circle at 50% 38%, rgb(121 128 113 / 42%), transparent 44%),
        #171814;
      opacity: 1;
      transition: opacity 520ms ease;
    }

    .intro.is-exiting {
      pointer-events: none;
      opacity: 0;
    }

    .intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.78;
    }

    .intro.has-media-error .intro-video {
      opacity: 0.16;
    }

    .intro-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgb(15 16 13 / 32%), rgb(15 16 13 / 18%) 44%, rgb(15 16 13 / 76%));
    }

    .intro-content {
      position: relative;
      display: grid;
      width: min(calc(100% - 48px), 420px);
      min-height: 100svh;
      padding: 64px 0 38px;
      grid-template-rows: 1fr auto;
      text-align: center;
    }

    .intro-heading {
      display: grid;
      margin: 0;
      place-content: center;
      gap: 14px;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity var(--intro-message-fade-duration, 600ms) ease,
        transform var(--intro-message-fade-duration, 600ms) ease;
    }

    .intro.is-message-fading .intro-heading {
      opacity: 0;
      transform: translateY(-6px);
    }

    .intro.is-message-hidden .intro-heading {
      visibility: hidden;
    }

    .intro-names {
      font-family: var(--serif);
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .intro-message {
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    .intro-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
    }

    .intro-progress {
      position: relative;
      height: 1px;
      grid-column: 1 / -1;
      overflow: hidden;
      background: rgb(255 255 255 / 30%);
    }

    .intro-progress::after {
      position: absolute;
      inset: 0;
      background: currentColor;
      content: '';
      transform-origin: left;
      animation: intro-progress 8s linear infinite paused;
    }

    .intro.is-video-playing .intro-progress::after {
      animation-play-state: running;
    }

    @keyframes intro-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .intro-control {
      min-width: 88px;
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 48%);
      color: inherit;
      background: rgb(15 16 13 / 28%);
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .intro-sound {
      justify-self: start;
    }

    .intro-status {
      margin: 12px 0 0;
      grid-column: 1 / -1;
      font-size: 0.72rem;
    }

    .invitation-section {
      position: relative;
      padding: clamp(72px, 20vw, 112px) clamp(24px, 8vw, 44px);
    }

    .has-reveal-motion .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 720ms ease, transform 720ms ease;
    }

    .has-reveal-motion .reveal.is-visible {
      opacity: 1;
      transform: none;
    }

    .invitation-section + .invitation-section::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 36px;
      height: 1px;
      background: var(--line);
      content: '';
      transform: translateX(-50%);
    }

    .section-header {
      margin-bottom: 42px;
      text-align: center;
    }

    .section-eyebrow,
    .card-eyebrow,
    .story-year {
      margin: 0 0 12px;
      color: var(--bronze);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 13em;
      margin: 0 auto;
      font-family: var(--serif);
      font-size: clamp(1.85rem, 8vw, 2.75rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.22;
      white-space: pre-line;
    }

    .section-copy {
      margin: 0;
      color: var(--muted);
      text-align: center;
      white-space: pre-line;
    }

    .hero-section {
      display: flex;
      min-height: 100svh;
      padding: 72px 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-section::before {
      display: none;
    }

    .hero-section .section-header {
      position: relative;
      z-index: 2;
      margin: 0 0 -48px;
      padding: 30px 14px 0;
      text-align: left;
    }

    .hero-section .section-title {
      max-width: 7em;
      margin: 0;
      font-size: clamp(3.1rem, 16vw, 5.1rem);
      letter-spacing: -0.065em;
      line-height: 0.88;
    }

    .hero-section .section-eyebrow {
      color: var(--sage);
    }

    .hero-media {
      width: calc(100% - 34px);
      margin-left: auto;
      aspect-ratio: 3 / 4.15;
    }

    .hero-footer {
      display: grid;
      margin-top: 22px;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 20px;
    }

    .hero-names {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }

    .hero-date {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-align: right;
    }

    .media-frame {
      position: relative;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(145deg, #dcd7cd, #c9c2b5 48%, #e5e0d7);
    }

    .media-frame img {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      padding: 18px;
      place-items: center;
      color: rgb(32 33 29 / 62%);
      background:
        radial-gradient(circle at 32% 28%, rgb(255 255 255 / 48%), transparent 24%),
        linear-gradient(135deg, rgb(121 128 113 / 18%), transparent 52%),
        linear-gradient(30deg, #e3ded4, #cbc5ba);
      font-family: var(--serif);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .invitation-lines {
      display: grid;
      margin: 0;
      gap: 5px;
      color: var(--muted);
      text-align: center;
    }

    .invitation-lines p {
      min-height: 1em;
      margin: 0;
    }

    .family-line {
      margin: 42px 0 0;
      font-family: var(--serif);
      font-size: 1.02rem;
      line-height: 2;
      text-align: center;
    }

    .couple-grid {
      display: grid;
      gap: 12px;
    }

    .person-card {
      display: grid;
      min-height: 236px;
      padding: 30px 24px;
      border: 1px solid var(--line);
      align-content: space-between;
      background: rgb(255 255 255 / 16%);
    }

    .person-role {
      margin: 0;
      color: var(--sage);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .person-name {
      margin: 8px 0 0;
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 400;
    }

    .person-english {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
    }

    .contact-button,
    .share-button,
    .copy-button,
    .nav-link {
      display: inline-flex;
      border: 1px solid var(--line);
      align-items: center;
      justify-content: center;
      background: transparent;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .contact-button {
      width: 100%;
      margin-top: 26px;
    }

    .schedule-summary {
      margin-bottom: 34px;
      text-align: center;
    }

    .schedule-date {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.3rem;
      letter-spacing: 0.02em;
    }

    .schedule-meta {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
    }

    .calendar caption {
      margin-bottom: 18px;
      font-family: var(--serif);
      font-size: 1.05rem;
    }

    .calendar th {
      height: 34px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .calendar abbr {
      text-decoration: none;
    }

    .calendar td {
      height: 42px;
      font-family: var(--serif);
      font-size: 0.86rem;
    }

    .calendar [aria-current='date'] span {
      display: inline-grid;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      place-items: center;
      color: var(--paper);
      background: var(--sage);
    }

    .countdown {
      display: grid;
      margin-top: 38px;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .countdown-item {
      padding: 14px 3px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .countdown-value {
      display: block;
      font-family: var(--serif);
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .countdown-label {
      color: var(--muted);
      font-size: 0.55rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .countdown-message {
      margin: 18px 0 0;
      color: var(--sage);
      font-family: var(--serif);
      text-align: center;
    }

    .story-list {
      position: relative;
      display: grid;
      gap: 40px;
    }

    .story-list::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 13px;
      width: 1px;
      background: var(--line);
      content: '';
    }

    .story-item {
      position: relative;
      padding-left: 48px;
    }

    .story-item::before {
      position: absolute;
      top: 6px;
      left: 9px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--bronze);
      box-shadow: 0 0 0 1px var(--bronze);
      content: '';
    }

    .story-title,
    .notice-title,
    .transport-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 400;
    }

    .story-label,
    .story-body,
    .notice-body,
    .transport-lines {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .story-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 8px;
    }

    .gallery-button {
      position: relative;
      min-width: 0;
      padding: 0;
      border: 0;
      grid-column: span 7;
      background: transparent;
      cursor: pointer;
    }

    .gallery-button:nth-child(4n + 2),
    .gallery-button:nth-child(4n + 3) {
      grid-column: span 5;
    }

    .gallery-button:nth-child(4n + 4) {
      grid-column: 5 / span 8;
    }

    .gallery-button .media-frame {
      width: 100%;
      aspect-ratio: 4 / 5;
    }

    .gallery-button:nth-child(3n + 2) .media-frame {
      aspect-ratio: 3 / 4.45;
    }

    .location-address {
      margin: 0;
      text-align: center;
    }

    .location-hall {
      display: block;
      margin-top: 2px;
      color: var(--muted);
    }

    .venue-phone {
      display: flex;
      width: fit-content;
      min-height: 44px;
      margin: 10px auto 30px;
      align-items: center;
      font-size: 0.78rem;
    }

    .map-media {
      aspect-ratio: 4 / 3;
    }

    .navigation-links {
      display: grid;
      margin-top: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .nav-link {
      padding: 8px 4px;
      letter-spacing: 0;
    }

    .transport-list,
    .notice-list {
      display: grid;
      gap: 12px;
    }

    .transport-item,
    .notice-card {
      padding: 26px 24px;
      border-top: 1px solid var(--line);
    }

    .transport-lines {
      white-space: pre-line;
    }

    .notice-card {
      border: 1px solid var(--line);
      background: rgb(255 255 255 / 15%);
    }

    .account-groups {
      display: grid;
      gap: 10px;
    }

    .account-group {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .account-group summary {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: var(--serif);
      list-style: none;
    }

    .account-group summary::-webkit-details-marker {
      display: none;
    }

    .account-group summary::after {
      color: var(--bronze);
      content: '+';
      font-family: var(--sans);
    }

    .account-group[open] summary::after {
      content: '−';
    }

    .account-list {
      display: grid;
      padding: 0 0 18px;
      gap: 8px;
    }

    .account-row {
      display: grid;
      padding: 16px;
      grid-template-columns: 1fr auto;
      gap: 12px;
      background: rgb(121 128 113 / 8%);
    }

    .account-holder,
    .account-number {
      margin: 0;
    }

    .account-number {
      color: var(--muted);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .copy-button {
      min-width: 58px;
      padding: 4px 10px;
    }

    .share-panel {
      text-align: center;
    }

    .share-button {
      width: min(100%, 260px);
      margin-top: 28px;
      padding: 10px 22px;
      color: var(--paper);
      background: var(--ink);
    }

    .outro-section {
      display: flex;
      min-height: 72svh;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .outro-lines {
      display: grid;
      gap: 4px;
      font-family: var(--serif);
      font-size: 1.13rem;
    }

    .outro-lines p {
      margin: 0;
    }

    .outro-meta {
      margin: 42px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.09em;
    }

    dialog {
      width: min(calc(100% - 32px), 420px);
      max-height: calc(100dvh - 32px);
      padding: 0;
      border: 0;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 24px 80px rgb(22 22 18 / 30%);
    }

    dialog::backdrop {
      background: rgb(23 23 20 / 72%);
      backdrop-filter: blur(3px);
    }

    .dialog-inner {
      padding: 28px;
    }

    .dialog-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
    }

    .dialog-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .lightbox-media {
      min-height: min(68dvh, 620px);
    }

    .lightbox-media .media-frame {
      width: 100%;
      min-height: min(68dvh, 620px);
    }

    .lightbox-controls {
      display: grid;
      padding: 12px 28px 24px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .lightbox-control {
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
    }

    .contact-list {
      display: grid;
      margin: 24px 0 0;
      gap: 10px;
    }

    .contact-row {
      display: grid;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
    }

    .contact-name {
      margin: 0;
    }

    .contact-phone,
    .address-copy-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      color: var(--sage);
      font-size: 0.78rem;
    }

    .address-copy-button {
      margin: 10px auto 22px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      z-index: 30;
      right: 16px;
      bottom: 16px;
      left: 16px;
      max-width: 400px;
      min-height: 0;
      margin: auto;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      padding: 10px 16px;
      color: var(--paper);
      background: var(--ink);
      opacity: 1;
      transform: none;
    }

    @media (min-width: 520px) {
      .couple-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 700px) {
      body {
        padding: 44px 0;
      }

      .invitation-page {
        box-shadow: 0 26px 80px rgb(42 38 31 / 22%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .has-reveal-motion .reveal,
      .has-reveal-motion .reveal.is-visible {
        opacity: 1;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .media-placeholder,
      .calendar [aria-current='date'],
      .share-button {
        border: 2px solid CanvasText;
        color: CanvasText;
        background: Canvas;
        forced-color-adjust: auto;
      }

      .story-item::before {
        background: CanvasText;
      }
    }
  </style>
</head>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="wedding-utils">
    const WeddingUtils = Object.freeze((() => {
      const DAY_MS = 24 * 60 * 60 * 1000;
      const KOREA_OFFSET_MS = 9 * 60 * 60 * 1000;

      function koreaDateKey(timeMs) {
        return Math.floor((timeMs + KOREA_OFFSET_MS) / DAY_MS);
      }

      function calendarCells(dateKey) {
        const match = String(dateKey).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return [];
        const year = Number(match[1]);
        const month = Number(match[2]);
        const weddingDay = Number(match[3]);
        const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        if (month < 1 || month > 12 || weddingDay < 1 || weddingDay > lastDay) return [];
        const cells = Array(new Date(Date.UTC(year, month - 1, 1)).getUTCDay()).fill(null);
        for (let day = 1; day <= lastDay; day += 1) {
          cells.push({ day, isWedding: day === weddingDay });
        }
        while (cells.length % 7) cells.push(null);
        return cells;
      }

      function countdownParts(targetMs, nowMs) {
        const empty = { days: 0, hours: 0, minutes: 0, seconds: 0 };
        if (!Number.isFinite(targetMs) || !Number.isFinite(nowMs)) return { state: 'invalid', ...empty };
        const remaining = targetMs - nowMs;
        if (remaining <= 0) {
          return { state: koreaDateKey(nowMs) === koreaDateKey(targetMs) ? 'today' : 'after', ...empty };
        }
        return {
          state: 'before',
          days: Math.floor(remaining / DAY_MS),
          hours: Math.floor((remaining % DAY_MS) / 3600000),
          minutes: Math.floor((remaining % 3600000) / 60000),
          seconds: Math.floor((remaining % 60000) / 1000),
        };
      }

      function telHref(value) {
        const raw = String(value || '').trim();
        const prefix = raw.startsWith('+') ? '+' : '';
        return `tel:${prefix}${raw.replace(/\D/g, '')}`;
      }

      function toLines(value) {
        return Array.isArray(value) ? value.slice() : String(value || '').split(/\r?\n/);
      }

      return { calendarCells, countdownParts, telHref, toLines };
    })());
  </script>
  <script id="wedding-app">
    const WeddingApp = Object.freeze((() => {
      const SECTION_RENDERERS = {
        hero: renderHero,
        invitation: renderInvitation,
        couple: renderCouple,
        schedule: renderSchedule,
        story: renderStory,
        gallery: renderGallery,
        location: renderLocation,
        transportation: renderTransportation,
        notices: renderNotices,
        accounts: renderAccounts,
        share: renderShare,
        outro: renderOutro,
      };
      const dialogTriggers = new WeakMap();
      let introFinished = false;
      let introFallbackTimer = 0;
      let introRemovalTimer = 0;
      let introMessageTimer = 0;
      let introPlaybackTimer = 0;
      let countdownTimer = 0;
      let galleryIndex = 0;
      let toastTimer = 0;

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function mediaFrame(src, alt, label) {
        const frame = element('figure', 'media-frame');
        frame.dataset.media = String(src || '');
        const placeholder = element('span', 'media-placeholder', label || '사진을 준비하고 있습니다');
        frame.append(placeholder);

        if (String(src || '').trim()) {
          const image = element('img');
          image.alt = String(alt || '');
          image.loading = 'lazy';
          image.decoding = 'async';
          image.addEventListener('load', () => {
            placeholder.remove();
          }, { once: true });
          image.addEventListener('error', () => {
            image.remove();
            frame.classList.add('has-media-error');
          }, { once: true });
          image.src = src;
          frame.append(image);
        } else {
          frame.classList.add('has-media-error');
        }

        return frame;
      }

      function sectionShell(key, eyebrow, title, headingTag = 'h2') {
        const section = element('section', `invitation-section ${key}-section reveal`);
        section.dataset.section = key;
        const header = element('header', 'section-header');
        if (eyebrow) header.append(element('p', 'section-eyebrow', eyebrow));
        if (title) header.append(element(headingTag, 'section-title', title));
        const body = element('div', 'section-body');
        section.append(header, body);
        return section;
      }

      function sectionBody(section) {
        return section.querySelector('.section-body');
      }

      function renderHero() {
        const section = sectionShell('hero', 'Wedding Invitation', WEDDING_CONFIG.messages.hero, 'h1');
        const body = sectionBody(section);
        const media = mediaFrame(WEDDING_CONFIG.media.hero, `${WEDDING_CONFIG.couple.groom.name}과 ${WEDDING_CONFIG.couple.bride.name}의 대표 사진`, 'Main Portrait');
        media.classList.add('hero-media');
        const footer = element('div', 'hero-footer');
        footer.append(
          element('p', 'hero-names', `${WEDDING_CONFIG.couple.groom.name} · ${WEDDING_CONFIG.couple.bride.name}`),
          element('p', 'hero-date', WEDDING_CONFIG.wedding.displayDate),
        );
        body.append(media, footer);
        return section;
      }

      function renderInvitation() {
        const section = sectionShell('invitation', 'Invitation', WEDDING_CONFIG.messages.invitationTitle);
        const lines = element('div', 'invitation-lines');
        WeddingUtils.toLines(WEDDING_CONFIG.messages.invitation).forEach(line => {
          lines.append(element('p', '', line || '\u00a0'));
        });
        const family = element('p', 'family-line');
        family.append(
          document.createTextNode(`${WEDDING_CONFIG.couple.groom.parents.map(parent => parent.name).join(' · ')}의 아들 ${WEDDING_CONFIG.couple.groom.name}`),
          element('br'),
          document.createTextNode(`${WEDDING_CONFIG.couple.bride.parents.map(parent => parent.name).join(' · ')}의 딸 ${WEDDING_CONFIG.couple.bride.name}`),
        );
        sectionBody(section).append(lines, family);
        return section;
      }

      function renderCouple() {
        const section = sectionShell('couple', 'Bride & Groom', '두 사람을 소개합니다');
        const grid = element('div', 'couple-grid');
        [['groom', '신랑'], ['bride', '신부']].forEach(([side, role]) => {
          const person = WEDDING_CONFIG.couple[side];
          const card = element('article', 'person-card');
          const identity = element('div');
          identity.append(
            element('p', 'person-role', role),
            element('h3', 'person-name', person.name),
            element('p', 'person-english', person.englishName),
          );
          card.append(identity);
          const hasPhone = [person.phone, ...person.parents.map(parent => parent.phone)].some(phone => String(phone || '').trim());
          if (hasPhone) {
            const contact = element('button', 'contact-button', `${role}측에 연락하기`);
            contact.type = 'button';
            contact.dataset.contactSide = side;
            card.append(contact);
          }
          grid.append(card);
        });
        sectionBody(section).append(grid);
        return section;
      }

      function renderSchedule() {
        const section = sectionShell('schedule', 'The Day', '예식 일정');
        const body = sectionBody(section);
        const summary = element('div', 'schedule-summary');
        summary.append(
          element('p', 'schedule-date', WEDDING_CONFIG.wedding.displayDate),
          element('p', 'schedule-meta', `${WEDDING_CONFIG.wedding.displayTime} · ${WEDDING_CONFIG.wedding.venue}`),
        );
        body.append(summary);

        const cells = WeddingUtils.calendarCells(WEDDING_CONFIG.wedding.dateKey);
        if (cells.length) {
          const [year, month] = WEDDING_CONFIG.wedding.dateKey.split('-');
          const table = element('table', 'calendar');
          table.append(element('caption', '', `${year}. ${month}`));
          const head = element('thead');
          const headRow = element('tr');
          [['SUN', '일요일'], ['MON', '월요일'], ['TUE', '화요일'], ['WED', '수요일'], ['THU', '목요일'], ['FRI', '금요일'], ['SAT', '토요일']].forEach(([day, koreanDay]) => {
            const columnHeader = element('th');
            columnHeader.setAttribute('scope', 'col');
            const abbreviation = element('abbr', '', day);
            abbreviation.title = koreanDay;
            columnHeader.append(abbreviation);
            headRow.append(columnHeader);
          });
          head.append(headRow);
          const calendarBody = element('tbody');
          for (let index = 0; index < cells.length; index += 7) {
            const row = element('tr');
            cells.slice(index, index + 7).forEach(cell => {
              const dateCell = element('td');
              if (cell) {
                dateCell.append(element('span', '', cell.day));
                if (cell.isWedding) dateCell.setAttribute('aria-current', 'date');
              }
              row.append(dateCell);
            });
            calendarBody.append(row);
          }
          table.append(head, calendarBody);
          body.append(table);
        }

        const targetMs = Date.parse(WEDDING_CONFIG.wedding.iso);
        const countdownParts = WeddingUtils.countdownParts(targetMs, Date.now());
        if (countdownParts.state !== 'invalid') {
          const countdown = element('div', 'countdown');
          countdown.setAttribute('aria-label', '결혼식까지 남은 시간');
          [['days', 'Days'], ['hours', 'Hours'], ['minutes', 'Min'], ['seconds', 'Sec']].forEach(([unit, label]) => {
            const item = element('div', 'countdown-item');
            const value = element('strong', 'countdown-value', 0);
            value.dataset.countdownUnit = unit;
            item.append(value, element('span', 'countdown-label', label));
            countdown.append(item);
          });
          body.append(countdown);
          const message = element('p', 'countdown-message');
          body.append(message);
          startCountdown(countdown, message, targetMs);
        }
        return section;
      }

      function countdownMessage(state) {
        if (state === 'before') return '두 사람의 결혼식이 다가오고 있습니다.';
        if (state === 'today') return '오늘, 저희 결혼합니다.';
        return '함께 축복해 주셔서 감사합니다.';
      }

      function stopCountdown() {
        if (!countdownTimer) return;
        window.clearInterval(countdownTimer);
        countdownTimer = 0;
      }

      function updateCountdown(countdown, message, targetMs) {
        const parts = WeddingUtils.countdownParts(targetMs, Date.now());
        countdown.querySelectorAll('[data-countdown-unit]').forEach(value => {
          value.textContent = String(parts[value.dataset.countdownUnit]);
        });
        message.textContent = countdownMessage(parts.state);
        if (parts.state !== 'before') stopCountdown();
        return parts.state;
      }

      function startCountdown(countdown, message, targetMs) {
        stopCountdown();
        if (updateCountdown(countdown, message, targetMs) !== 'before') return;
        countdownTimer = window.setInterval(() => {
          updateCountdown(countdown, message, targetMs);
        }, 1000);
      }

      function renderStory() {
        const section = sectionShell('story', 'Our Story', '우리의 시간');
        const list = element('div', 'story-list');
        WEDDING_CONFIG.story.forEach(item => {
          const article = element('article', 'story-item');
          article.append(
            element('p', 'story-year', item.year),
            element('p', 'story-label', item.label),
            element('h3', 'story-title', item.title),
            element('p', 'story-body', item.body),
          );
          list.append(article);
        });
        sectionBody(section).append(list);
        return section;
      }

      function renderGallery() {
        const section = sectionShell('gallery', 'Gallery', '빛나는 순간들');
        const grid = element('div', 'gallery-grid');
        WEDDING_CONFIG.media.gallery.forEach((item, index) => {
          const button = element('button', 'gallery-button');
          button.type = 'button';
          button.dataset.galleryIndex = index;
          button.setAttribute('aria-label', `${item.alt || `웨딩 사진 ${index + 1}`} 크게 보기`);
          button.append(mediaFrame(item.src, item.alt, `Photo ${String(index + 1).padStart(2, '0')}`));
          grid.append(button);
        });
        sectionBody(section).append(grid);
        return section;
      }

      function renderLocation() {
        const section = sectionShell('location', 'Location', '오시는 길');
        const body = sectionBody(section);
        const address = element('p', 'location-address', WEDDING_CONFIG.wedding.venue);
        address.append(element('span', 'location-hall', WEDDING_CONFIG.wedding.hall), element('br'), document.createTextNode(WEDDING_CONFIG.wedding.address));
        body.append(address);
        if (String(WEDDING_CONFIG.wedding.address || '').trim()) {
          const copyAddress = element('button', 'address-copy-button', '주소 복사');
          copyAddress.type = 'button';
          copyAddress.dataset.copyAddress = WEDDING_CONFIG.wedding.address;
          body.append(copyAddress);
        }
        if (String(WEDDING_CONFIG.wedding.phone || '').trim()) {
          const phone = element('a', 'venue-phone', WEDDING_CONFIG.wedding.phone);
          phone.href = WeddingUtils.telHref(WEDDING_CONFIG.wedding.phone);
          phone.setAttribute('aria-label', `${WEDDING_CONFIG.wedding.venue}에 전화하기`);
          body.append(phone);
        }
        const map = mediaFrame(WEDDING_CONFIG.media.map, `${WEDDING_CONFIG.wedding.venue} 약도`, 'Map Preview');
        map.classList.add('map-media');
        body.append(map);
        const links = element('nav', 'navigation-links');
        links.setAttribute('aria-label', '지도 앱으로 길 찾기');
        [['naver', '네이버 지도'], ['kakao', '카카오맵'], ['tmap', '티맵']].forEach(([key, label]) => {
          const url = String(WEDDING_CONFIG.navigation[key] || '').trim();
          if (!url) return;
          const link = element('a', 'nav-link', label);
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          links.append(link);
        });
        if (links.childElementCount) body.append(links);
        return section;
      }

      function renderTransportation() {
        const section = sectionShell('transportation', 'Information', '교통 안내');
        const list = element('div', 'transport-list');
        WEDDING_CONFIG.transportation.forEach(item => {
          const article = element('article', 'transport-item');
          article.append(element('h3', 'transport-title', item.title));
          const lines = WeddingUtils.toLines(item.lines).filter(Boolean).join('\n');
          if (lines) article.append(element('p', 'transport-lines', lines));
          list.append(article);
        });
        sectionBody(section).append(list);
        return section;
      }

      function renderNotices() {
        const section = sectionShell('notices', 'Notice', '안내 말씀');
        const list = element('div', 'notice-list');
        WEDDING_CONFIG.notices.forEach(item => {
          const article = element('article', 'notice-card');
          article.append(
            element('p', 'card-eyebrow', item.eyebrow),
            element('h3', 'notice-title', item.title),
            element('p', 'notice-body', item.body),
          );
          list.append(article);
        });
        sectionBody(section).append(list);
        return section;
      }

      function renderAccounts() {
        const section = sectionShell('accounts', 'With Thanks', '마음 전하실 곳');
        const groups = element('div', 'account-groups');
        const sides = [...new Set(WEDDING_CONFIG.accounts.map(account => account.side))];
        sides.forEach(side => {
          const details = element('details', 'account-group');
          details.dataset.accountSide = side;
          details.append(element('summary', '', side));
          const list = element('div', 'account-list');
          WEDDING_CONFIG.accounts.filter(account => account.side === side).forEach(account => {
            const row = element('div', 'account-row');
            const info = element('div');
            info.append(
              element('p', 'account-holder', `${account.holder} · ${account.bank}`),
              element('p', 'account-number', account.number),
            );
            row.append(info);
            if (String(account.number || '').trim()) {
              const copy = element('button', 'copy-button', '복사');
              copy.type = 'button';
              copy.dataset.copyAccount = account.number;
              copy.setAttribute('aria-label', `${account.holder} 계좌번호 복사`);
              row.append(copy);
            }
            list.append(row);
          });
          details.append(list);
          groups.append(details);
        });
        sectionBody(section).append(groups);
        return section;
      }

      function renderShare() {
        const section = sectionShell('share', 'Share', '초대장을 나눠주세요');
        const panel = element('div', 'share-panel');
        panel.append(element('p', 'section-copy', WEDDING_CONFIG.sharing.text));
        const button = element('button', 'share-button', '초대장 공유하기');
        button.type = 'button';
        button.dataset.share = '';
        panel.append(button);
        sectionBody(section).append(panel);
        return section;
      }

      function renderOutro() {
        const section = sectionShell('outro', WEDDING_CONFIG.messages.signature, '함께해 주셔서 감사합니다');
        section.querySelector('.section-title').classList.add('visually-hidden');
        const body = sectionBody(section);
        const lines = element('div', 'outro-lines');
        WeddingUtils.toLines(WEDDING_CONFIG.messages.outro).forEach(line => lines.append(element('p', '', line)));
        body.append(
          lines,
          element('p', 'outro-meta', `${WEDDING_CONFIG.wedding.displayDate}\n${WEDDING_CONFIG.wedding.venue} · ${WEDDING_CONFIG.wedding.hall}`),
        );
        return section;
      }

      function applyTheme() {
        const root = document.documentElement;
        root.style.setProperty('--page-width', WEDDING_CONFIG.theme.maxWidth);
        root.style.setProperty('--paper', WEDDING_CONFIG.theme.paper);
        root.style.setProperty('--ink', WEDDING_CONFIG.theme.ink);
        root.style.setProperty('--muted', WEDDING_CONFIG.theme.muted);
        root.style.setProperty('--sage', WEDDING_CONFIG.theme.sage);
        root.style.setProperty('--bronze', WEDDING_CONFIG.theme.bronze);
      }

      function renderSections() {
        const app = document.getElementById('invitation-app');
        if (!app) return;
        stopCountdown();
        const fragment = new DocumentFragment();
        Object.entries(SECTION_RENDERERS).forEach(([key, renderer]) => {
          if (WEDDING_CONFIG.sections[key] === true) fragment.append(renderer());
        });
        app.replaceChildren(fragment);
      }

      function announce(message) {
        const toast = document.getElementById('toast');
        if (!toast || !message) return;
        window.clearTimeout(toastTimer);
        toast.textContent = '';
        window.requestAnimationFrame(() => {
          toast.textContent = message;
          toast.classList.add('is-visible');
          toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2400);
        });
      }

      async function copyText(value) {
        const text = String(value || '');
        if (!text) return false;

        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (error) {
            // Security restrictions can reject clipboard access for local files.
          }
        }

        const textarea = element('textarea', 'visually-hidden');
        textarea.value = text;
        textarea.readOnly = true;
        textarea.setAttribute('aria-hidden', 'true');
        document.body.append(textarea);
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (error) {
          copied = false;
        } finally {
          textarea.remove();
        }
        return copied;
      }

      function restoreDialogFocus(dialog) {
        const trigger = dialogTriggers.get(dialog);
        dialogTriggers.delete(dialog);
        if (trigger && trigger.isConnected && typeof trigger.focus === 'function') trigger.focus();
      }

      function openDialog(dialog, trigger) {
        if (!dialog) return;
        dialogTriggers.set(dialog, trigger);
        if (!dialog.open) {
          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
          } else {
            dialog.setAttribute('open', '');
          }
        }
        window.requestAnimationFrame(() => {
          const closeButton = dialog.querySelector('.dialog-close');
          if (closeButton) closeButton.focus();
        });
      }

      function closeDialog(dialog) {
        if (!dialog) return;
        if (dialog.open && typeof dialog.close === 'function') {
          dialog.close();
        } else {
          dialog.removeAttribute('open');
        }
        restoreDialogFocus(dialog);
      }

      function setupDialog(dialog) {
        if (!dialog) return;
        const closeButton = dialog.querySelector('.dialog-close');
        if (closeButton) closeButton.addEventListener('click', () => closeDialog(dialog));
        dialog.addEventListener('cancel', event => {
          event.preventDefault();
          closeDialog(dialog);
        });
        dialog.addEventListener('click', event => {
          if (event.target === dialog) closeDialog(dialog);
        });
        dialog.addEventListener('close', () => restoreDialogFocus(dialog));
      }

      function renderContactDialog(side) {
        const dialog = document.getElementById('contact-dialog');
        const content = dialog && dialog.querySelector('[data-contact-content]');
        const person = WEDDING_CONFIG.couple[side];
        if (!dialog || !content || !person) return null;

        const list = element('div', 'contact-list');
        [{ name: person.name, phone: person.phone }, ...person.parents].forEach(contact => {
          if (!String(contact.phone || '').trim()) return;
          const row = element('div', 'contact-row');
          row.append(element('p', 'contact-name', contact.name));
          const phone = element('a', 'contact-phone', contact.phone);
          phone.href = WeddingUtils.telHref(contact.phone);
          phone.setAttribute('aria-label', `${contact.name}에게 전화하기`);
          row.append(phone);
          list.append(row);
        });
        content.replaceChildren(list);
        return dialog;
      }

      function updateGallery(nextIndex) {
        const items = WEDDING_CONFIG.media.gallery;
        const dialog = document.getElementById('lightbox-dialog');
        const content = dialog && dialog.querySelector('[data-lightbox-content]');
        if (!dialog || !content || !items.length) return;
        galleryIndex = ((Number(nextIndex) % items.length) + items.length) % items.length;
        const item = items[galleryIndex];
        const alt = item.alt || `웨딩 사진 ${galleryIndex + 1}`;
        content.replaceChildren(mediaFrame(item.src, alt, `Photo ${String(galleryIndex + 1).padStart(2, '0')}`));
        dialog.setAttribute('aria-label', `${alt} 크게 보기`);
      }

      function setupLightbox() {
        const dialog = document.getElementById('lightbox-dialog');
        const inner = dialog && dialog.querySelector('.dialog-inner');
        const closeButton = dialog && dialog.querySelector('.dialog-close');
        if (!dialog || !inner || !closeButton) return;
        const controls = element('div', 'lightbox-controls');
        const previous = element('button', 'lightbox-control', '이전 사진');
        previous.type = 'button';
        previous.dataset.galleryDirection = '-1';
        const next = element('button', 'lightbox-control', '다음 사진');
        next.type = 'button';
        next.dataset.galleryDirection = '1';
        controls.append(previous, next);
        inner.insertBefore(controls, closeButton);
      }

      async function shareInvitation() {
        if (typeof navigator.share === 'function') {
          try {
            await navigator.share({
              title: WEDDING_CONFIG.sharing.title,
              text: WEDDING_CONFIG.sharing.text,
              url: location.href,
            });
            announce('초대장을 공유했습니다.');
          } catch (error) {
            if (error && error.name === 'AbortError') return;
            announce('초대장을 공유하지 못했습니다.');
          }
          return;
        }

        const copied = await copyText(location.href);
        announce(copied ? '초대장 주소를 복사했습니다.' : '초대장 주소를 복사하지 못했습니다.');
      }

      function bindInteractions() {
        setupDialog(document.getElementById('contact-dialog'));
        setupDialog(document.getElementById('lightbox-dialog'));
        setupLightbox();

        document.addEventListener('click', async event => {
          const trigger = event.target.closest('button, a');
          if (!trigger) return;

          if (trigger.dataset.contactSide) {
            const dialog = renderContactDialog(trigger.dataset.contactSide);
            if (dialog) openDialog(dialog, trigger);
            return;
          }

          if (trigger.dataset.galleryIndex !== undefined) {
            updateGallery(Number(trigger.dataset.galleryIndex));
            openDialog(document.getElementById('lightbox-dialog'), trigger);
            return;
          }

          if (trigger.dataset.galleryDirection) {
            updateGallery(galleryIndex + Number(trigger.dataset.galleryDirection));
            return;
          }

          const copyValue = trigger.dataset.copyAccount || trigger.dataset.copyAddress;
          if (copyValue) {
            const copied = await copyText(copyValue);
            const label = trigger.dataset.copyAddress ? '주소' : '계좌번호';
            announce(copied ? `${label}를 복사했습니다.` : `${label}를 복사하지 못했습니다.`);
            return;
          }

          if (trigger.dataset.share !== undefined) await shareInvitation();
        });
      }

      function initRevealMotion() {
        const reveals = [...document.querySelectorAll('.reveal')];
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion || typeof window.IntersectionObserver !== 'function') {
          reveals.forEach(node => node.classList.add('is-visible'));
          return;
        }

        document.body.classList.add('has-reveal-motion');
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          });
        }, { rootMargin: '0px 0px -8%', threshold: 0.08 });
        reveals.forEach(node => observer.observe(node));
      }

      function introDelay(value, fallback) {
        const duration = Number(value);
        return Number.isFinite(duration) ? Math.max(0, duration) : fallback;
      }

      function clearIntroSequenceTimers() {
        window.clearTimeout(introMessageTimer);
        window.clearTimeout(introPlaybackTimer);
        introMessageTimer = 0;
        introPlaybackTimer = 0;
      }

      function scheduleIntroFallback() {
        window.clearTimeout(introFallbackTimer);
        const configuredDelay = Number(WEDDING_CONFIG.intro.fallbackDelayMs);
        const delay = Number.isFinite(configuredDelay) ? Math.max(0, configuredDelay) : 0;
        introFallbackTimer = window.setTimeout(() => finishIntro('media-error'), delay);
      }

      function handleIntroMediaError() {
        clearIntroSequenceTimers();
        if (introFinished) return;
        const intro = document.getElementById('intro');
        if (!intro) return;
        intro.classList.add('has-media-error');
        const skip = document.getElementById('intro-skip');
        if (skip) skip.textContent = '청첩장 보기';
        const status = intro.querySelector('[data-intro-status]');
        if (status) status.textContent = `인트로 영상을 불러올 수 없습니다: ${WEDDING_CONFIG.intro.video}`;
        scheduleIntroFallback();
      }

      function handleIntroKeydown(event) {
        if (event.key === 'Escape' && !introFinished) finishIntro('escape');
      }

      function restoreInvitationAccess(app) {
        if (!app) return;
        app.inert = false;
        app.removeAttribute('inert');
        app.removeAttribute('aria-hidden');
      }

      function finishIntro(reason = 'complete') {
        clearIntroSequenceTimers();
        const app = document.getElementById('invitation-app');
        document.removeEventListener('keydown', handleIntroKeydown);
        restoreInvitationAccess(app);
        if (introFinished) return;
        introFinished = true;
        window.clearTimeout(introFallbackTimer);
        window.clearTimeout(introRemovalTimer);
        document.body.classList.remove('is-intro-open');

        const intro = document.getElementById('intro');
        const video = document.getElementById('intro-video');
        if (video) {
          try {
            video.pause();
          } catch (error) {
            // Media may already be unavailable; exiting must still continue.
          }
        }
        if (!intro) {
          if (app) app.focus({ preventScroll: true });
          return;
        }

        intro.dataset.exitReason = reason;
        intro.setAttribute('aria-hidden', 'true');
        intro.classList.add('is-exiting');
        if (app) app.focus({ preventScroll: true });

        const removeIntro = () => {
          window.clearTimeout(introRemovalTimer);
          intro.removeEventListener('transitionend', onTransitionEnd);
          intro.remove();
        };
        const onTransitionEnd = event => {
          if (event.target === intro && event.propertyName === 'opacity') removeIntro();
        };
        intro.addEventListener('transitionend', onTransitionEnd);

        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          removeIntro();
        } else {
          introRemovalTimer = window.setTimeout(removeIntro, 700);
        }
      }

      function renderIntro() {
        clearIntroSequenceTimers();
        const app = document.getElementById('invitation-app');
        document.removeEventListener('keydown', handleIntroKeydown);
        if (WEDDING_CONFIG.sections.intro !== true) {
          restoreInvitationAccess(app);
          return;
        }
        const template = document.getElementById('intro-template');
        if (!template || !app) {
          restoreInvitationAccess(app);
          return;
        }
        introFinished = false;
        app.inert = true;
        app.setAttribute('inert', '');
        app.setAttribute('aria-hidden', 'true');
        app.before(template.content.cloneNode(true));
        document.body.classList.add('is-intro-open');

        const intro = document.getElementById('intro');
        const video = document.getElementById('intro-video');
        const skip = document.getElementById('intro-skip');
        const sound = document.getElementById('intro-sound');
        if (!intro || !video || !skip || !sound) {
          finishIntro('missing-intro');
          return;
        }
        const introNames = intro.querySelector('[data-intro-names]');
        const introMessage = intro.querySelector('[data-intro-message]');
        if (!introNames || !introMessage) {
          finishIntro('missing-intro-copy');
          return;
        }
        introNames.textContent = WEDDING_CONFIG.intro.names;
        introMessage.textContent = WEDDING_CONFIG.intro.message;

        video.autoplay = false;
        video.muted = Boolean(WEDDING_CONFIG.intro.muted);
        video.defaultMuted = video.muted;
        video.playsInline = true;
        video.preload = 'auto';
        if (String(WEDDING_CONFIG.intro.poster || '').trim()) video.poster = WEDDING_CONFIG.intro.poster;

        const updateSoundControl = () => {
          sound.textContent = video.muted ? 'SOUND ON' : 'SOUND OFF';
          sound.setAttribute('aria-pressed', String(!video.muted));
          sound.setAttribute('aria-label', video.muted ? '인트로 영상 소리 켜기' : '인트로 영상 소리 끄기');
        };
        updateSoundControl();

        skip.setAttribute('aria-label', '인트로 건너뛰기');
        skip.addEventListener('click', () => finishIntro('skip'));
        sound.addEventListener('click', () => {
          video.muted = !video.muted;
          updateSoundControl();
        });
        video.addEventListener('ended', () => finishIntro('ended'));
        video.addEventListener('error', handleIntroMediaError);
        document.addEventListener('keydown', handleIntroKeydown);
        skip.focus({ preventScroll: true });

        if (!String(WEDDING_CONFIG.intro.video || '').trim()) {
          handleIntroMediaError();
          return;
        }
        video.src = WEDDING_CONFIG.intro.video;

        const holdMs = introDelay(WEDDING_CONFIG.intro.messageHoldMs, 1000);
        const fadeMs = introDelay(WEDDING_CONFIG.intro.messageFadeMs, 600);
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        intro.style.setProperty('--intro-message-fade-duration', `${fadeMs}ms`);

        const playVideo = () => {
          introPlaybackTimer = 0;
          if (introFinished || document.getElementById('intro') !== intro) return;
          intro.classList.add('is-message-hidden');
          introMessage.setAttribute('aria-hidden', 'true');
          introNames.setAttribute('aria-hidden', 'true');
          video.currentTime = 0;
          try {
            const playResult = video.play();
            if (playResult && typeof playResult.catch === 'function') playResult.catch(handleIntroMediaError);
          } catch (error) {
            handleIntroMediaError();
          }
        };

        const fadeMessage = () => {
          introMessageTimer = 0;
          if (introFinished || document.getElementById('intro') !== intro) return;
          intro.classList.add('is-message-fading');
          if (reducedMotion) {
            playVideo();
            return;
          }
          introPlaybackTimer = window.setTimeout(playVideo, fadeMs);
        };

        video.addEventListener('playing', () => intro.classList.add('is-video-playing'));
        introMessageTimer = window.setTimeout(fadeMessage, holdMs);
      }

      function init() {
        document.title = `${WEDDING_CONFIG.couple.groom.name} ♥ ${WEDDING_CONFIG.couple.bride.name} 결혼식에 초대합니다`;
        applyTheme();
        renderSections();
        bindInteractions();
        initRevealMotion();
        renderIntro();
      }

      return { init, renderSections, finishIntro, openDialog, closeDialog, copyText };
    })());

    WeddingApp.init();
  </script>
</body>
</html>
