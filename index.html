  <style>
    :root {
      --page-width: 460px;
      --paper: #f2f8ff; /* 전체 배경색: 이 값만 변경하세요 */
      --reveal-duration: 1600ms; /* 글씨 등장 속도: 숫자가 클수록 천천히 나타납니다 */
      --reveal-distance: 80px; /* 글씨 상승 거리: 숫자가 작을수록 차분하게 움직입니다 */
      --reveal-body-delay: 200ms; /* 본문 시작 간격: 숫자가 클수록 늦게 시작합니다 */
      --gallery-gather-duration: 1700ms; /* 흩어진 사진 한 장이 가운데로 이동하는 시간: 숫자가 클수록 천천히 모입니다 */
      --gallery-gather-stagger-max: 520ms; /* 사진별 출발 시간 차이의 최댓값: 숫자가 클수록 한 장씩 모이는 느낌이 강해집니다 */
      --gallery-expand-duration: 1000ms; /* 모인 첫 사진이 원래 갤러리 크기로 커지는 시간: 숫자가 클수록 천천히 커집니다 */
      --gallery-reveal-duration: 1200ms; /* 확대 후 원래 갤러리가 나타나는 시간: 숫자가 클수록 천천히 나타납니다 */
      --gallery-photo-border: 1px solid rgb(240 240 240 / 70%); /* 갤러리 사진 테두리: 테두리를 없애려면 이 값을 none으로 바꾸세요 */
      --gallery-control-color: rgb(57 67 69 / 62%); /* 갤러리 화살표·닫기·사진 번호 색상: 진하기는 마지막 62%를 조절하세요 */
      --gallery-lightbox-fade-duration: 500ms; /* 사진 확대·닫기 페이드 시간: 숫자가 클수록 천천히 전환됩니다 */
      --ink: #244346;
      --muted: #6b8586;
      --green: #497a71;
      --sky: #cdedf4;
      --soft-green: #b8d8cb;
      --line: color-mix(in srgb, var(--ink) 16%, transparent);
      --serif: Georgia, 'Times New Roman', 'Noto Serif KR', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      background: var(--paper);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.75;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
    }

    body.is-intro-open {
      overflow: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    .button,
    .nav-link {
      min-height: 44px;
    }

    button {
      color: inherit;
      font: inherit;
    }

    a {
      color: inherit;
      text-underline-offset: 0.22em;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    :focus {
      outline: none;
    }

    .invitation-page,
    .intro {
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 12% 18%, rgb(255 255 255 / 44%) 0 0.8px, transparent 1px),
        radial-gradient(circle at 82% 64%, rgb(36 67 70 / 6%) 0 0.7px, transparent 1px),
        linear-gradient(115deg, rgb(255 255 255 / 12%), transparent 44%, rgb(73 122 113 / 5%));
      background-size: 13px 17px, 19px 23px, 100% 100%;
      isolation: isolate;
    }

    .invitation-page {
      position: relative;
      width: 100%;
      max-width: var(--page-width);
      margin: 0 auto;
      overflow: hidden;
    }

    .invitation-page:focus {
      outline: none;
    }

    .intro {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: center;
      color: var(--ink);
      opacity: 1;
      transition: opacity 520ms ease;
    }

    .intro.is-exiting {
      pointer-events: none;
      opacity: 0;
    }

    .intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity var(--intro-message-fade-duration, 1200ms) ease;
      visibility: hidden;
    }

    .intro.is-video-playing .intro-video {
      opacity: 1;
      visibility: visible;
    }

    .intro-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      visibility: hidden;
    }

    .intro.is-manual-playback .intro-poster {
      opacity: 1;
      visibility: visible;
    }

    .intro-play {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      display: grid;
      width: 64px;
      height: 64px;
      min-width: 64px;
      min-height: 64px;
      padding: 0;
      border: 1px solid rgb(36 67 70 / 14%);
      border-radius: 50%;
      place-items: center;
      color: var(--ink);
      background: rgb(255 255 255 / 96%);
      box-shadow:
        0 14px 30px rgb(36 67 70 / 18%),
        0 3px 8px rgb(36 67 70 / 12%);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .intro-play[hidden] {
      display: none;
    }

    .intro-play:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    .intro-play-icon {
      width: 26px;
      height: 26px;
      margin-left: 3px;
      fill: currentColor;
      pointer-events: none;
    }

    @media (hover: hover) {
      .intro-play:hover {
        box-shadow:
          0 17px 34px rgb(36 67 70 / 21%),
          0 4px 10px rgb(36 67 70 / 13%);
        transform: translate(-50%, -50%) scale(1.03);
      }
    }

    .intro-content {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(calc(100% - 48px), 420px);
      min-height: 100vh;
      min-height: 100svh;
      padding: 64px 0 38px;
      grid-template-rows: 1fr auto;
      text-align: center;
    }

    .intro-stage {
      position: relative;
      display: grid;
      width: 100%;
      aspect-ratio: 4 / 5;
      align-self: center;
      overflow: hidden;
      place-items: center;
    }

    .intro-heading {
      display: grid;
      margin: 0;
      place-content: center;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity var(--intro-message-fade-duration, 1200ms) ease,
        transform var(--intro-message-fade-duration, 1200ms) ease;
    }

    .intro.is-message-fading .intro-heading {
      opacity: 0;
      transform: translateY(-6px);
    }

    .intro.is-message-hidden .intro-heading {
      visibility: hidden;
    }

    .intro-name {
      font-family: 'Courgette', cursive;
      font-size: clamp(3.6rem, 18vw, 5.4rem);
      font-weight: 400;
      line-height: 0.82;
    }

    .intro-connector {
      margin: 10px 0 8px;
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1;
    }

    .intro-message {
      margin-top: 30px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .intro-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
    }

    .intro-progress {
      position: relative;
      height: 1px;
      grid-column: 1 / -1;
      overflow: hidden;
      background: color-mix(in srgb, var(--ink) 22%, transparent);
    }

    .intro-progress::after {
      position: absolute;
      inset: 0;
      background: var(--ink);
      content: '';
      transform: scaleX(var(--intro-progress, 0));
      transform-origin: left;
    }

    .intro-control {
      display: inline-flex;
      min-height: 0;
      padding: 4px 12px;
      border: 0;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      background: rgb(0 0 0 / 40%);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      cursor: pointer;
      font-family: Pretendard, var(--sans);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: normal;
      line-height: 22px;
    }

    #intro-skip {
      grid-column: 2;
      justify-self: end;
    }

    .intro-status {
      margin: 12px 0 0;
      grid-column: 1 / -1;
      font-size: 0.72rem;
    }

    .invitation-section {
      position: relative;
      padding: clamp(72px, 20vw, 112px) clamp(24px, 8vw, 44px);
    }

    .has-reveal-motion .reveal .section-header,
    .has-reveal-motion .reveal .section-body {
      opacity: 0;
      transition-property: opacity, transform;
      transition-timing-function: ease-in-out;
    }

    .has-reveal-motion .reveal .section-header {
      transform: translateY(var(--reveal-distance));
      transition-duration: var(--reveal-duration);
    }

    .has-reveal-motion .reveal .section-body {
      transform: translateY(var(--reveal-distance));
      transition-duration: var(--reveal-duration);
      transition-delay: var(--reveal-body-delay);
    }

    .has-reveal-motion .reveal.is-visible .section-header,
    .has-reveal-motion .reveal.is-visible .section-body {
      opacity: 1;
      transform: none;
    }

    .invitation-section + .invitation-section::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 36px;
      height: 1px;
      background: var(--line);
      content: '';
      transform: translateX(-50%);
    }

    .section-header {
      margin-bottom: 42px;
      text-align: center;
    }

    .section-eyebrow,
    .card-eyebrow,
    .story-year {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 13em;
      margin: 0 auto;
      font-family: var(--serif);
      font-size: clamp(1.85rem, 8vw, 2.75rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.22;
      white-space: pre-line;
    }

    .section-copy {
      margin: 0;
      color: var(--muted);
      text-align: center;
      white-space: pre-line;
    }

    .hero-section {
      display: flex;
      min-height: 100svh;
      padding: 72px 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-section::before {
      display: none;
    }

    .hero-section .section-header {
      position: relative;
      z-index: 2;
      margin: 0 0 32px;
      padding: 30px 0 0;
      text-align: left;
    }

    .hero-section .section-title {
      max-width: 100%;
      margin: 0;
      font-family: 'Courgette', cursive;
      font-size: calc((min(100vw, var(--page-width)) - 40px) * .12);
      letter-spacing: 0;
      line-height: 0.95;
      white-space: nowrap;
    }

    .hero-media {
      width: 100%;
      margin-left: 0;
      aspect-ratio: 3 / 4.15;
    }

    .hero-footer {
      display: grid;
      margin-top: 22px;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 20px;
    }

    .hero-names {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }

    .hero-date {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-align: right;
    }

    .media-frame {
      position: relative;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(145deg, var(--sky), var(--soft-green) 48%, color-mix(in srgb, var(--sky) 72%, white));
    }

    .media-frame img {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      padding: 18px;
      place-items: center;
      color: rgb(36 67 70 / 62%);
      background:
        radial-gradient(circle at 32% 28%, rgb(255 255 255 / 48%), transparent 24%),
        linear-gradient(135deg, rgb(73 122 113 / 16%), transparent 52%),
        linear-gradient(30deg, var(--sky), var(--soft-green));
      font-family: var(--serif);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .invitation-lines {
      display: grid;
      margin: 0;
      gap: 5px;
      color: var(--muted);
      text-align: center;
    }

    .invitation-lines p {
      min-height: 1em;
      margin: 0;
    }

    .family-line {
      margin: 42px 0 0;
      font-family: var(--serif);
      font-size: 1.02rem;
      line-height: 2;
      text-align: center;
    }

    .couple-grid {
      display: grid;
      gap: 12px;
    }

    .person-card {
      display: grid;
      min-height: 236px;
      padding: 30px 24px;
      border: 1px solid var(--line);
      align-content: space-between;
      background: rgb(255 255 255 / 16%);
    }

    .person-role {
      margin: 0;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .person-name {

      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 400;
    }

    .person-english {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
    }

    .contact-button,
    .share-button,
    .copy-button,
    .nav-link {

      border: 1px solid var(--line);

      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .contact-button {
      width: 100%;
      margin-top: 26px;
    }

    .schedule-summary {
      margin-bottom: 34px;
      text-align: center;
    }

    .schedule-date {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.3rem;
      letter-spacing: 0.02em;
    }

    .schedule-meta {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
    }

    .calendar caption {
      margin-bottom: 18px;
      font-family: var(--serif);
      font-size: 1.05rem;
    }

    .calendar th {
      height: 34px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .calendar abbr {
      text-decoration: none;
    }

    .calendar td {
      height: 42px;
      font-family: var(--serif);
      font-size: 0.86rem;
    }

    .calendar [aria-current='date'] span {
      display: inline-grid;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      place-items: center;
      color: var(--paper);
      background: var(--green);
    }

    .countdown {
      display: grid;
      margin-top: 38px;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .countdown-item {
      padding: 14px 3px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .countdown-value {
      display: block;
      font-family: var(--serif);
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .countdown-label {
      color: var(--muted);
      font-size: 0.55rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .countdown-message {
      margin: 18px 0 0;
      color: var(--green);
      font-family: var(--serif);
      text-align: center;
    }

    .story-list {
      position: relative;
      display: grid;
      gap: 40px;
    }

    .story-list::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 13px;
      width: 1px;
      background: var(--line);
      content: '';
    }

    .story-item {
      position: relative;
      padding-left: 48px;
    }

    .story-item::before {
      position: absolute;
      top: 6px;
      left: 9px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 1px var(--green);
      content: '';
    }

    .story-title,
    .notice-title,
    .transport-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 400;
    }

    .story-label,
    .story-body,
    .notice-body,
    .transport-lines {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .story-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .gallery-carousel {
      position: relative;
    }

    .gallery-stage {
      position: relative;
      height: clamp(350px, 112vw, 480px);
      overflow: hidden;
      touch-action: pan-y;
    }

    .gallery-opening {
      position: absolute;
      z-index: 20;
      inset: 0;
      transition: opacity var(--gallery-reveal-duration) cubic-bezier(.22, 1, .36, 1);
    }

    .gallery-opening-card {
      position: absolute;
      top: calc(50% + var(--gallery-opening-y));
      left: calc(50% + var(--gallery-opening-x));
      width: min(42%, 184px);
      max-width: 184px;
      aspect-ratio: 2 / 3;
      border: 0;
      border-radius: 0;
      opacity: .96;
      background: transparent;
      box-shadow: 0 18px 38px rgb(36 67 70 / 18%);
      transform: translate(-50%, -50%) rotate(var(--gallery-opening-rotation)) scale(var(--gallery-opening-scale));
      transition:
        top var(--gallery-gather-duration) cubic-bezier(.22, 1, .36, 1),
        left var(--gallery-gather-duration) cubic-bezier(.22, 1, .36, 1),
        width var(--gallery-gather-duration) cubic-bezier(.22, 1, .36, 1),
        max-width var(--gallery-gather-duration) cubic-bezier(.22, 1, .36, 1),
        border-color var(--gallery-gather-duration) ease,
        opacity var(--gallery-gather-duration) ease,
        box-shadow var(--gallery-gather-duration) ease,
        transform var(--gallery-gather-duration) cubic-bezier(.22, 1, .36, 1);
      transition-delay: var(--gallery-opening-delay);
    }

    .gallery-opening-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .gallery-opening-card .media-frame {
      width: 100%;
      height: 100%;
      aspect-ratio: 2 / 3;
      border: var(--gallery-photo-border);
      border-radius: 2px;
    }

    .gallery-opening-button {
      position: absolute;
      z-index: 100;
      top: 50%;
      left: 50%;
      min-width: 132px;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid rgb(255 255 255 / 82%);
      border-radius: 999px;
      color: var(--ink);
      background: rgb(255 255 255 / 90%);
      box-shadow: 0 10px 28px rgb(36 67 70 / 22%);
      cursor: pointer;
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .06em;
      transform: translate(-50%, -50%);
      transition: opacity 420ms ease, transform 620ms cubic-bezier(.22, 1, .36, 1);
      backdrop-filter: blur(8px);
    }

    .gallery-card {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: 72%;
      max-width: 300px;
      min-height: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      background: transparent;
      box-shadow: 0 18px 38px rgb(36 67 70 / 18%), 0 -6px 20px rgb(36 67 70 / 5%);
      cursor: pointer;
      filter: blur(2px) saturate(.78);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.84);
      transition:
        left 680ms cubic-bezier(.22, 1, .36, 1),
        width 680ms cubic-bezier(.22, 1, .36, 1),
        opacity 520ms ease,
        filter 520ms ease,
        transform 680ms cubic-bezier(.22, 1, .36, 1);
    }

    .gallery-card[data-gallery-position='current'] {
      z-index: 3;
      opacity: 1;
      filter: none;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .gallery-card[data-gallery-position='current'] .media-frame {
      border: var(--gallery-photo-border);
    }

    .gallery-card[data-gallery-position='previous'],
    .gallery-card[data-gallery-position='next'] {
      z-index: 1;
      width: 55%;
      opacity: .58;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(.9);
    }

    .gallery-card[data-gallery-position='previous'] {
      left: 23%;
    }

    .gallery-card[data-gallery-position='next'] {
      left: 77%;
    }

    .gallery-card .media-frame {
      width: 100%;
      margin: 0;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      border-radius: 2px;
    }

    .gallery-counter,
    .lightbox-counter {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 12px;
      padding: 5px 8px;
      /*color: var(--gallery-control-color);*/
      background: rgb(240 240 240 / 35%);
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 1.4;
      backdrop-filter: blur(5px);
    }

    .gallery-counter {
      transition: opacity 520ms ease;
    }

    .gallery-card:not([data-gallery-position='current']) .gallery-counter {
      opacity: 0;
    }

    .gallery-stage.is-counter-hidden .gallery-counter {
      opacity: 0;
    }

    .gallery-nav,
    .lightbox-control {
      display: grid;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0 0 3px;
      border: 0;
      border-radius: 0;
      place-items: center;
      color: var(--gallery-control-color);
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 1.75rem;
      line-height: 1;
      text-shadow: 0 1px 3px rgb(255 255 255 / 86%);
      backdrop-filter: none;
    }

    .gallery-nav {
      position: absolute;
      z-index: 5;
      top: 50%;
      transform: translateY(-50%);
    }

    .gallery-nav[data-gallery-direction='-1'] { left: 0; }
    .gallery-nav[data-gallery-direction='1'] { right: 0; }

    .gallery-stage.is-single .gallery-nav {
      display: none;
    }

    .gallery-stage[data-gallery-opening-phase]:not([data-gallery-opening-phase='opened']) > .gallery-card,
    .gallery-stage[data-gallery-opening-phase]:not([data-gallery-opening-phase='opened']) > .gallery-nav {
      pointer-events: none;
    }

    .gallery-stage[data-gallery-opening-phase='scattered'] > .gallery-card,
    .gallery-stage[data-gallery-opening-phase='scattered'] > .gallery-nav,
    .gallery-stage[data-gallery-opening-phase='gathering'] > .gallery-card,
    .gallery-stage[data-gallery-opening-phase='gathering'] > .gallery-nav,
    .gallery-stage[data-gallery-opening-phase='expanding'] > .gallery-card,
    .gallery-stage[data-gallery-opening-phase='expanding'] > .gallery-nav {
      visibility: hidden;
      opacity: 0;
    }

    .gallery-stage[data-gallery-opening-phase='revealing'] > .gallery-card {
      visibility: visible;
      transition-duration: var(--gallery-reveal-duration);
    }

    .gallery-stage[data-gallery-opening-phase='revealing'] > .gallery-nav {
      visibility: visible;
      opacity: 1;
      transition: opacity var(--gallery-reveal-duration) ease;
    }

    .gallery-stage[data-gallery-opening-phase='gathering'] .gallery-opening-card {
      top: 50%;
      left: 50%;
      opacity: .2;
      transform: translate(-50%, -50%) rotate(0deg) scale(.96);
    }

    .gallery-stage[data-gallery-opening-phase='gathering'] .gallery-opening-card:not(.is-lead) > .media-frame,
    .gallery-stage[data-gallery-opening-phase='expanding'] .gallery-opening-card:not(.is-lead) > .media-frame,
    .gallery-stage[data-gallery-opening-phase='revealing'] .gallery-opening-card:not(.is-lead) > .media-frame {
      border: var(--gallery-photo-border);
    }

    .gallery-stage[data-gallery-opening-phase='gathering'] .gallery-opening-card.is-lead {
      opacity: 1;
    }

    .gallery-stage[data-gallery-opening-phase='gathering'] .gallery-opening-button,
    .gallery-stage[data-gallery-opening-phase='expanding'] .gallery-opening-button,
    .gallery-stage[data-gallery-opening-phase='revealing'] .gallery-opening-button {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -45%) scale(.94);
    }

    .gallery-stage[data-gallery-opening-phase='expanding'] .gallery-opening-card:not(.is-lead),
    .gallery-stage[data-gallery-opening-phase='revealing'] .gallery-opening-card:not(.is-lead) {
      opacity: 0;
      transition-delay: 0ms;
      transition-duration: 240ms;
    }

    .gallery-stage[data-gallery-opening-phase='expanding'] .gallery-opening-card.is-lead,
    .gallery-stage[data-gallery-opening-phase='revealing'] .gallery-opening-card.is-lead {
      top: 50%;
      left: 50%;
      width: 72%;
      max-width: 300px;
      opacity: 1;
      box-shadow: none;
      transform: translate(-50%, -50%) scale(1);
      transition:
        top var(--gallery-expand-duration) cubic-bezier(.22, 1, .36, 1),
        left var(--gallery-expand-duration) cubic-bezier(.22, 1, .36, 1),
        width var(--gallery-expand-duration) cubic-bezier(.22, 1, .36, 1),
        max-width var(--gallery-expand-duration) cubic-bezier(.22, 1, .36, 1),
        border-color var(--gallery-expand-duration) ease,
        opacity var(--gallery-expand-duration) ease,
        box-shadow var(--gallery-expand-duration) ease,
        transform var(--gallery-expand-duration) cubic-bezier(.22, 1, .36, 1);
      transition-delay: 0ms;
    }

    .gallery-stage[data-gallery-opening-phase='expanding'] .gallery-opening-card.is-lead > .media-frame,
    .gallery-stage[data-gallery-opening-phase='revealing'] .gallery-opening-card.is-lead > .media-frame {
      border: var(--gallery-photo-border);
    }

    .gallery-empty {
      margin: 0;
      color: var(--muted);
      text-align: center;
    }

    .location-address {
      margin: 0;
      text-align: center;
    }

    .location-hall {
      display: block;
      margin-top: 2px;
      color: var(--muted);
    }

    .venue-phone {
      display: flex;
      width: fit-content;
      min-height: 44px;
      margin: 10px auto 30px;
      align-items: center;
      font-size: 0.78rem;
    }

    .map-media {
      aspect-ratio: 4 / 3;
    }

    .navigation-links {
      display: grid;
      margin-top: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .nav-link {
      padding: 8px 4px;
      letter-spacing: 0;
    }

    .transport-list,
    .notice-list {
      display: grid;
      gap: 12px;
    }

    .transport-item,
    .notice-card {
      padding: 26px 24px;
      border-top: 1px solid var(--line);
    }

    .transport-lines {
      white-space: pre-line;
    }

    .notice-card {
      border: 1px solid var(--line);
      background: rgb(255 255 255 / 15%);
    }

    .account-groups {
      display: grid;
      gap: 10px;
    }

    .account-group {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .account-group summary {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: var(--serif);
      list-style: none;
    }

    .account-group summary::-webkit-details-marker {
      display: none;
    }

    .account-group summary::after {
      color: var(--green);
      content: '+';
      font-family: var(--sans);
    }

    .account-group[open] summary::after {
      content: '−';
    }

    .account-list {
      display: grid;
      padding: 0 0 18px;
      gap: 8px;
    }

    .account-row {
      display: grid;
      padding: 16px;
      grid-template-columns: 1fr auto;
      gap: 12px;
      background: rgb(73 122 113 / 8%);
    }

    .account-holder,
    .account-number {
      margin: 0;
    }

    .account-number {
      color: var(--muted);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .copy-button {
      min-width: 58px;
      padding: 4px 10px;
    }

    .share-panel {
      text-align: center;
    }

    .share-button {
      width: min(100%, 260px);
      margin-top: 28px;
      padding: 10px 22px;
      color: var(--paper);
      background: var(--ink);
    }

    .outro-section {
      display: flex;
      min-height: 72svh;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .outro-lines {
      display: grid;
      gap: 4px;
      font-family: var(--serif);
      font-size: 1.13rem;
    }

    .outro-lines p {
      margin: 0;
    }

    .outro-meta {
      margin: 42px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.09em;
    }

    dialog {
      width: min(calc(100% - 32px), 420px);
      max-height: calc(100dvh - 32px);
      padding: 0;
      border: 0;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 24px 80px rgb(36 67 70 / 30%);
    }

    dialog::backdrop {
      background: rgb(36 67 70 / 72%);
      backdrop-filter: blur(3px);
    }

    .dialog-inner {
      padding: 28px;
    }

    .dialog-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
    }

    .dialog-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #lightbox-dialog {
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      color: var(--gallery-control-color);
      background: white;
      box-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--gallery-lightbox-fade-duration) ease;
    }

    #lightbox-dialog.is-lightbox-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #lightbox-dialog::backdrop {
      background: white;
      backdrop-filter: none;
      opacity: 0;
      transition: opacity var(--gallery-lightbox-fade-duration) ease;
    }

    #lightbox-dialog.is-lightbox-visible::backdrop {
      opacity: 1;
    }

    #lightbox-dialog .dialog-inner {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      padding: 0;
      place-items: center;
      background: white;
    }

    #lightbox-dialog .dialog-close {
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      color: var(--gallery-control-color);
      font-family: var(--sans);
      font-size: 2rem;
      font-weight: 200;
      line-height: 1;
    }

    .lightbox-media {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      background: white;
      touch-action: pan-y;
    }

    .lightbox-picture {
      position: relative;
      width: 100%;
      height: 100dvh;
    }

    .lightbox-picture .media-frame {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: white;
    }

    .lightbox-picture .media-frame img {
      object-fit: contain;
    }

    .lightbox-controls {
      position: absolute;
      z-index: 8;
      inset: 0;
      pointer-events: none;
    }

    .lightbox-control {
      position: absolute;
      top: 50%;
      color: var(--gallery-control-color);
      background: transparent;
      pointer-events: auto;
      transform: translateY(-50%);
      transition: opacity 520ms ease;
    }

    .lightbox-control[data-gallery-direction='-1'] {
      left: max(12px, env(safe-area-inset-left));
    }

    .lightbox-control[data-gallery-direction='1'] {
      right: max(12px, env(safe-area-inset-right));
    }

    .lightbox-counter {
      top: calc(max(12px, env(safe-area-inset-top)) + 22px);
      right: auto;
      left: 50%;
      color: var(--gallery-control-color);
      background: rgb(240 240 240 / 35%);
      backdrop-filter: none;
      transform: translate(-50%, -50%);
      transition: opacity 520ms ease;
    }

    #lightbox-dialog.is-controls-hidden .lightbox-auto-control {
      opacity: 0;
      pointer-events: none;
    }

    #lightbox-dialog.is-single .lightbox-controls {
      display: none;
    }

    .contact-list {
      display: grid;
      margin: 24px 0 0;
      gap: 10px;
    }

    .contact-row {
      display: grid;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
    }

    .contact-name {
      margin: 0;
    }

    .contact-phone,
    .address-copy-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      color: var(--green);
      font-size: 0.78rem;
    }

    .address-copy-button {
      margin: 10px auto 22px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      z-index: 30;
      right: 16px;
      bottom: 16px;
      left: 16px;
      max-width: 400px;
      min-height: 0;
      margin: auto;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      padding: 10px 16px;
      color: var(--paper);
      background: var(--ink);
      opacity: 1;
      transform: none;
    }

    @media (min-width: 520px) {
      .couple-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 700px) {
      body {
        padding: 44px 0;
      }

      .invitation-page {
        box-shadow: 0 26px 80px rgb(36 67 70 / 22%);
      }
    }

    @media (forced-colors: active) {
      .media-placeholder,
      .calendar [aria-current='date'],
      .share-button {
        border: 2px solid CanvasText;
        color: CanvasText;
        background: Canvas;
        forced-color-adjust: auto;
      }

      .story-item::before {
        background: CanvasText;
      }
    }
  </style>
</head>

            <span data-intro-skip-label>SKIP</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="22" viewBox="0 0 18 22" fill="none" aria-hidden="true" focusable="false"><path d="M10.0352 6.62361C10.2428 6.44161 10.5592 6.46281 10.7412 6.67049L16.876 13.6705C17.0051 13.818 17.0359 14.027 16.9551 14.2056C16.874 14.3844 16.6962 14.4996 16.5 14.4996H1.5C1.22388 14.4996 1.00003 14.2757 1 13.9996C1 13.7234 1.22386 13.4996 1.5 13.4996H15.3975L9.98926 7.32869C9.80753 7.12112 9.82784 6.8056 10.0352 6.62361Z" fill="white"/></svg>
          </button>

  <script id="wedding-utils">
    const WeddingUtils = Object.freeze((() => {
      const DAY_MS = 24 * 60 * 60 * 1000;
      const KOREA_OFFSET_MS = 9 * 60 * 60 * 1000;

      function koreaDateKey(timeMs) {
        return Math.floor((timeMs + KOREA_OFFSET_MS) / DAY_MS);
      }

      function calendarCells(dateKey) {
        const match = String(dateKey).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return [];
        const year = Number(match[1]);
        const month = Number(match[2]);
        const weddingDay = Number(match[3]);
        const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        if (month < 1 || month > 12 || weddingDay < 1 || weddingDay > lastDay) return [];
        const cells = Array(new Date(Date.UTC(year, month - 1, 1)).getUTCDay()).fill(null);
        for (let day = 1; day <= lastDay; day += 1) {
          cells.push({ day, isWedding: day === weddingDay });
        }
        while (cells.length % 7) cells.push(null);
        return cells;
      }

      function countdownParts(targetMs, nowMs) {
        const empty = { days: 0, hours: 0, minutes: 0, seconds: 0 };
        if (!Number.isFinite(targetMs) || !Number.isFinite(nowMs)) return { state: 'invalid', ...empty };
        const remaining = targetMs - nowMs;
        if (remaining <= 0) {
          return { state: koreaDateKey(nowMs) === koreaDateKey(targetMs) ? 'today' : 'after', ...empty };
        }
        return {
          state: 'before',
          days: Math.floor(remaining / DAY_MS),
          hours: Math.floor((remaining % DAY_MS) / 3600000),
          minutes: Math.floor((remaining % 3600000) / 60000),
          seconds: Math.floor((remaining % 60000) / 1000),
        };
      }

      function telHref(value) {
        const raw = String(value || '').trim();
        const prefix = raw.startsWith('+') ? '+' : '';
        return `tel:${prefix}${raw.replace(/\D/g, '')}`;
      }

      function toLines(value) {
        return Array.isArray(value) ? value.slice() : String(value || '').split(/\r?\n/);
      }

      function galleryOpeningDelays(count, maxDelayMs) {
        const length = Math.max(0, Math.floor(Number(count) || 0));
        const maximum = Math.max(0, Number(maxDelayMs) || 0);
        return Array.from({ length }, (_, index) => Math.round(((index * 47) % 101) / 100 * maximum));
      }

      function cssTimeMs(value) {
        const match = String(value || '').trim().match(/^(\d*\.?\d+)(ms|s)$/i);
        if (!match) return 0;
        const milliseconds = Number(match[1]) * (match[2].toLowerCase() === 's' ? 1000 : 1);
        return Number.isFinite(milliseconds) ? Math.max(0, milliseconds) : 0;
      }

      return { calendarCells, countdownParts, cssTimeMs, galleryOpeningDelays, telHref, toLines };
    })());
  </script>
  <script id="wedding-app">
    const WeddingApp = Object.freeze((() => {
      const SECTION_RENDERERS = {
        hero: renderHero,
        invitation: renderInvitation,
        couple: renderCouple,
        schedule: renderSchedule,
        story: renderStory,
        gallery: renderGallery,
        location: renderLocation,
        transportation: renderTransportation,
        notices: renderNotices,
        accounts: renderAccounts,
        share: renderShare,
        outro: renderOutro,
      };
      const dialogTriggers = new WeakMap();
      let introFinished = false;
      let introFallbackTimer = 0;
      let introRemovalTimer = 0;
      let introMessageTimer = 0;
      let introPlaybackTimer = 0;
      let introProgressFrame = 0;
      let countdownTimer = 0;
      let galleryIndex = 0;
      let galleryStage = null;
      let galleryCounterTimer = 0;
      let lightboxControlsTimer = 0;
      let lightboxTransitionTimer = 0;
      let toastTimer = 0;
      let revealMotionInitialized = false;

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function mediaFrame(src, alt, label) {
        const frame = element('figure', 'media-frame');
        frame.dataset.media = String(src || '');
        const placeholder = element('span', 'media-placeholder', label || '사진을 준비하고 있습니다');
        frame.append(placeholder);

        if (String(src || '').trim()) {
          const image = element('img');
          image.alt = String(alt || '');
          image.loading = 'lazy';
          image.decoding = 'async';
          image.addEventListener('load', () => {
            placeholder.remove();
          }, { once: true });
          image.addEventListener('error', () => {
            image.remove();
            frame.classList.add('has-media-error');
          }, { once: true });
          image.src = src;
          frame.append(image);
        } else {
          frame.classList.add('has-media-error');
        }

        return frame;
      }

      function sectionShell(key, eyebrow, title, headingTag = 'h2') {
        const section = element('section', `invitation-section ${key}-section reveal`);
        section.dataset.section = key;
        const header = element('header', 'section-header');
        if (eyebrow) header.append(element('p', 'section-eyebrow', eyebrow));
        if (title) header.append(element(headingTag, 'section-title', title));
        const body = element('div', 'section-body');
        section.append(header, body);
        return section;
      }

      function sectionBody(section) {
        return section.querySelector('.section-body');
      }

      function renderHero() {
        const section = sectionShell('hero', 'Wedding Invitation', WEDDING_CONFIG.messages.hero, 'h1');
        const body = sectionBody(section);
        const media = mediaFrame(WEDDING_CONFIG.media.hero, `${WEDDING_CONFIG.couple.groom.name}과 ${WEDDING_CONFIG.couple.bride.name}의 대표 사진`, 'Main Portrait');
        media.classList.add('hero-media');
        const footer = element('div', 'hero-footer');
        footer.append(
          element('p', 'hero-names', `${WEDDING_CONFIG.couple.groom.name} · ${WEDDING_CONFIG.couple.bride.name}`),
          element('p', 'hero-date', WEDDING_CONFIG.wedding.displayDate),
        );
        body.append(media, footer);
        return section;
      }

      function renderInvitation() {
        const section = sectionShell('invitation', 'Invitation', WEDDING_CONFIG.messages.invitationTitle);
        const lines = element('div', 'invitation-lines');
        WeddingUtils.toLines(WEDDING_CONFIG.messages.invitation).forEach(line => {
          lines.append(element('p', '', line || '\u00a0'));
        });
        const family = element('p', 'family-line');
        family.append(
          document.createTextNode(`${WEDDING_CONFIG.couple.groom.parents.map(parent => parent.name).join(' · ')}의 아들 ${WEDDING_CONFIG.couple.groom.name}`),
          element('br'),
          document.createTextNode(`${WEDDING_CONFIG.couple.bride.parents.map(parent => parent.name).join(' · ')}의 딸 ${WEDDING_CONFIG.couple.bride.name}`),
        );
        sectionBody(section).append(lines, family);
        return section;
      }

      function renderCouple() {
        const section = sectionShell('couple', 'Bride & Groom', '두 사람을 소개합니다');
        const grid = element('div', 'couple-grid');
        [['groom', '신랑'], ['bride', '신부']].forEach(([side, role]) => {
          const person = WEDDING_CONFIG.couple[side];
          const card = element('article', 'person-card');
          const identity = element('div');
          identity.append(
            element('p', 'person-role', role),
            element('h3', 'person-name', person.name),
            element('p', 'person-english', person.englishName),
          );
          card.append(identity);
          const hasPhone = [person.phone, ...person.parents.map(parent => parent.phone)].some(phone => String(phone || '').trim());
          if (hasPhone) {
            const contact = element('button', 'contact-button', `${role}측에 연락하기`);
            contact.type = 'button';
            contact.dataset.contactSide = side;
            card.append(contact);
          }
          grid.append(card);
        });
        sectionBody(section).append(grid);
        return section;
      }

      function renderSchedule() {
        const section = sectionShell('schedule', 'The Day', '예식 일정');
        const body = sectionBody(section);
        const summary = element('div', 'schedule-summary');
        summary.append(
          element('p', 'schedule-date', WEDDING_CONFIG.wedding.displayDate),
          element('p', 'schedule-meta', `${WEDDING_CONFIG.wedding.displayTime} · ${WEDDING_CONFIG.wedding.venue}`),
        );
        body.append(summary);

        const cells = WeddingUtils.calendarCells(WEDDING_CONFIG.wedding.dateKey);
        if (cells.length) {
          const [year, month] = WEDDING_CONFIG.wedding.dateKey.split('-');
          const table = element('table', 'calendar');
          table.append(element('caption', '', `${year}. ${month}`));
          const head = element('thead');
          const headRow = element('tr');
          [['SUN', '일요일'], ['MON', '월요일'], ['TUE', '화요일'], ['WED', '수요일'], ['THU', '목요일'], ['FRI', '금요일'], ['SAT', '토요일']].forEach(([day, koreanDay]) => {
            const columnHeader = element('th');
            columnHeader.setAttribute('scope', 'col');
            const abbreviation = element('abbr', '', day);
            abbreviation.title = koreanDay;
            columnHeader.append(abbreviation);
            headRow.append(columnHeader);
          });
          head.append(headRow);
          const calendarBody = element('tbody');
          for (let index = 0; index < cells.length; index += 7) {
            const row = element('tr');
            cells.slice(index, index + 7).forEach(cell => {
              const dateCell = element('td');
              if (cell) {
                dateCell.append(element('span', '', cell.day));
                if (cell.isWedding) dateCell.setAttribute('aria-current', 'date');
              }
              row.append(dateCell);
            });
            calendarBody.append(row);
          }
          table.append(head, calendarBody);
          body.append(table);
        }

        const targetMs = Date.parse(WEDDING_CONFIG.wedding.iso);
        const countdownParts = WeddingUtils.countdownParts(targetMs, Date.now());
        if (countdownParts.state !== 'invalid') {
          const countdown = element('div', 'countdown');
          countdown.setAttribute('aria-label', '결혼식까지 남은 시간');
          [['days', 'Days'], ['hours', 'Hours'], ['minutes', 'Min'], ['seconds', 'Sec']].forEach(([unit, label]) => {
            const item = element('div', 'countdown-item');
            const value = element('strong', 'countdown-value', 0);
            value.dataset.countdownUnit = unit;
            item.append(value, element('span', 'countdown-label', label));
            countdown.append(item);
          });
          body.append(countdown);
          const message = element('p', 'countdown-message');
          body.append(message);
          startCountdown(countdown, message, targetMs);
        }
        return section;
      }

      function countdownMessage(state) {
        if (state === 'before') return '두 사람의 결혼식이 다가오고 있습니다.';
        if (state === 'today') return '오늘, 저희 결혼합니다.';
        return '함께 축복해 주셔서 감사합니다.';
      }

      function stopCountdown() {
        if (!countdownTimer) return;
        window.clearInterval(countdownTimer);
        countdownTimer = 0;
      }

      function updateCountdown(countdown, message, targetMs) {
        const parts = WeddingUtils.countdownParts(targetMs, Date.now());
        countdown.querySelectorAll('[data-countdown-unit]').forEach(value => {
          value.textContent = String(parts[value.dataset.countdownUnit]);
        });
        message.textContent = countdownMessage(parts.state);
        if (parts.state !== 'before') stopCountdown();
        return parts.state;
      }

      function startCountdown(countdown, message, targetMs) {
        stopCountdown();
        if (updateCountdown(countdown, message, targetMs) !== 'before') return;
        countdownTimer = window.setInterval(() => {
          updateCountdown(countdown, message, targetMs);
        }, 1000);
      }

      function renderStory() {
        const section = sectionShell('story', 'Our Story', '우리의 시간');
        const list = element('div', 'story-list');
        WEDDING_CONFIG.story.forEach(item => {
          const article = element('article', 'story-item');
          article.append(
            element('p', 'story-year', item.year),
            element('p', 'story-label', item.label),
            element('h3', 'story-title', item.title),
            element('p', 'story-body', item.body),
          );
          list.append(article);
        });
        sectionBody(section).append(list);
        return section;
      }

      function setupGalleryOpening(stage, items) {
        if (!stage || !items.length || stage.dataset.galleryOpeningReady !== undefined) return;
        stage.dataset.galleryOpeningReady = '';
        stage.dataset.galleryOpeningPhase = 'scattered';

        const cssTimeToMs = (name, fallback) => {
          const value = getComputedStyle(stage).getPropertyValue(name).trim();
          const amount = Number.parseFloat(value);
          if (!Number.isFinite(amount)) return fallback;
          return Math.max(0, value.endsWith('ms') ? amount : amount * 1000);
        };
        const gatherMs = cssTimeToMs('--gallery-gather-duration', 1700);
        const staggerMaxMs = cssTimeToMs('--gallery-gather-stagger-max', 520);
        const expandMs = cssTimeToMs('--gallery-expand-duration', 1000);
        const revealMs = cssTimeToMs('--gallery-reveal-duration', 1200);
        const delays = WeddingUtils.galleryOpeningDelays(items.length, staggerMaxMs);
        const scatter = [
          [-27, -17, -14, .91], [-12, 18, 9, .96], [25, -13, -7, .93], [8, 21, 15, .9],
          [-24, 5, -10, .95], [29, 13, 6, .89], [-4, -21, 13, .92], [18, -1, -3, .96],
          [-18, 20, 9, .9], [3, -10, -16, .94], [23, 18, 3, .91], [-30, -19, -8, .95],
        ];
        const density = Math.max(.58, 1 - Math.max(0, items.length - 8) * .024);
        const opening = element('div', 'gallery-opening');
        opening.dataset.galleryOpening = '';
        opening.setAttribute('role', 'group');
        opening.setAttribute('aria-label', '사진첩 미리보기');

        items.forEach((item, index) => {
          const card = element('div', 'gallery-opening-card');
          const [x, y, rotation, scale] = scatter[index % scatter.length];
          const layer = Math.floor(index / scatter.length) % 5;
          card.classList.toggle('is-lead', index === 0);
          card.setAttribute('aria-hidden', 'true');
          card.style.zIndex = index === 0 ? items.length + 1 : index + 1;
          card.style.setProperty('--gallery-opening-x', `${(x * density) + layer * 1.4}%`);
          card.style.setProperty('--gallery-opening-y', `${(y * density) - layer * 1.1}%`);
          card.style.setProperty('--gallery-opening-rotation', `${rotation + layer * 1.2}deg`);
          card.style.setProperty('--gallery-opening-scale', String(scale));
          card.style.setProperty('--gallery-opening-delay', `${delays[index]}ms`);
          const frame = mediaFrame(item.src, '', `Photo ${String(index + 1).padStart(2, '0')}`);
          const image = frame.querySelector('img');
          if (image && index === 0) image.loading = 'eager';
          card.append(frame);
          opening.append(card);
        });

        const openButton = element('button', 'gallery-opening-button', '사진첩 보기');
        openButton.type = 'button';
        opening.append(openButton);
        stage.append(opening);

        const galleryCards = [...stage.querySelectorAll('[data-gallery-card]')];
        const galleryNav = [...stage.querySelectorAll('[data-gallery-direction]')];
        galleryCards.forEach(card => {
          card.tabIndex = -1;
          card.setAttribute('aria-hidden', 'true');
        });
        galleryNav.forEach(button => { button.tabIndex = -1; });

        const timers = [];
        const clearTimers = () => {
          timers.forEach(timer => window.clearTimeout(timer));
          timers.length = 0;
        };
        const schedule = (callback, delay) => {
          timers.push(window.setTimeout(callback, delay));
        };
        const isCurrentStage = () => stage === galleryStage && stage.isConnected;
        const finishOpening = () => {
          clearTimers();
          if (!isCurrentStage()) return;
          const restoreFocus = document.activeElement === openButton;
          stage.dataset.galleryOpeningPhase = 'opened';
          updateGalleryCards();
          galleryNav.forEach(button => { button.removeAttribute('tabindex'); });
          opening.remove();
          setupGalleryCounter(stage);
          showGalleryCounter();
          if (restoreFocus) {
            const current = stage.querySelector("[data-gallery-position='current']");
            if (current) current.focus({ preventScroll: true });
          }
        };

        openButton.addEventListener('click', () => {
          openButton.disabled = true;
          stage.dataset.galleryOpeningPhase = 'gathering';
          schedule(() => {
            if (!isCurrentStage()) return clearTimers();
            stage.dataset.galleryOpeningPhase = 'expanding';
            schedule(() => {
              if (!isCurrentStage()) return clearTimers();
              stage.dataset.galleryOpeningPhase = 'revealing';
              schedule(finishOpening, revealMs);
            }, expandMs);
          }, gatherMs + staggerMaxMs);
        });
      }

      function updateGalleryCards() {
        if (!galleryStage) return;
        const items = WEDDING_CONFIG.media.gallery;
        const length = items.length;
        galleryStage.classList[length < 2 ? 'add' : 'remove']('is-single');
        galleryStage.querySelectorAll('[data-gallery-card]').forEach((card, index) => {
          let position = 'hidden';
          if (index === galleryIndex) position = 'current';
          else if (length > 1 && index === (galleryIndex + 1) % length) position = 'next';
          else if (length > 2 && index === (galleryIndex - 1 + length) % length) position = 'previous';
          card.dataset.galleryPosition = position;
          card.tabIndex = position === 'hidden' ? -1 : 0;
          card.setAttribute('aria-hidden', position === 'hidden' ? 'true' : 'false');
        });
      }

      function showGalleryCounter() {
        if (!galleryStage) return;
        window.clearTimeout(galleryCounterTimer);
        galleryStage.classList.remove('is-counter-hidden');
        const stage = galleryStage;
        galleryCounterTimer = window.setTimeout(() => {
          if (stage === galleryStage) stage.classList.add('is-counter-hidden');
          galleryCounterTimer = 0;
        }, 2000);
      }

      function setupGalleryCounter(stage) {
        stage.addEventListener('pointerdown', showGalleryCounter);
        if (typeof window.IntersectionObserver !== 'function') {
          showGalleryCounter();
          return;
        }
        const observer = new window.IntersectionObserver(entries => {
          if (!entries.some(entry => entry.isIntersecting)) return;
          showGalleryCounter();
          observer.unobserve(stage);
        }, { threshold: 0.35 });
        observer.observe(stage);
      }

      function bindGallerySwipe(surface) {
        if (!surface || surface.dataset.gallerySwipeReady !== undefined) return;
        surface.dataset.gallerySwipeReady = '';
        let startX = null;
        let startY = null;
        surface.addEventListener('touchstart', event => {
          const touch = event.touches && event.touches[0];
          if (!touch) return;
          startX = touch.clientX;
          startY = touch.clientY;
        }, { passive: true });
        surface.addEventListener('touchend', event => {
          const touch = event.changedTouches && event.changedTouches[0];
          if (!touch || startX === null || startY === null) return;
          const deltaX = touch.clientX - startX;
          const deltaY = touch.clientY - startY;
          startX = null;
          startY = null;
          if (surface.dataset.galleryOpeningPhase && surface.dataset.galleryOpeningPhase !== 'opened') return;
          if (Math.abs(deltaX) < 44 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
          updateGallery(galleryIndex + (deltaX < 0 ? 1 : -1));
          if (surface.dataset.lightboxContent !== undefined) showLightboxControls();
        }, { passive: true });
      }

      function renderGallery() {
        const section = sectionShell('gallery', 'Gallery', '빛나는 순간들');
        const body = sectionBody(section);
        const items = WEDDING_CONFIG.media.gallery;
        if (!items.length) {
          window.clearTimeout(galleryCounterTimer);
          galleryCounterTimer = 0;
          galleryStage = null;
          body.append(element('p', 'gallery-empty', '사진을 준비하고 있습니다.'));
          return section;
        }

        const carousel = element('div', 'gallery-carousel');
        const stage = element('div', 'gallery-stage');
        galleryStage = stage;
        galleryIndex = 0;
        items.forEach((item, index) => {
          const button = element('button', 'gallery-card');
          button.type = 'button';
          button.dataset.galleryCard = '';
          button.dataset.galleryIndex = index;
          button.setAttribute('aria-label', `${item.alt || `웨딩 사진 ${index + 1}`} 크게 보기`);
          button.append(
            mediaFrame(item.src, item.alt, `Photo ${String(index + 1).padStart(2, '0')}`),
            element('span', 'gallery-counter', `${String(index + 1).padStart(2, '0')} / ${String(items.length).padStart(2, '0')}`),
          );
          stage.append(button);
        });
        const previous = element('button', 'gallery-nav', '‹');
        previous.type = 'button';
        previous.dataset.galleryDirection = '-1';
        previous.setAttribute('aria-label', '이전 사진');
        const next = element('button', 'gallery-nav', '›');
        next.type = 'button';
        next.dataset.galleryDirection = '1';
        next.setAttribute('aria-label', '다음 사진');
        stage.append(previous, next);
        carousel.append(stage);
        body.append(carousel);
        updateGalleryCards();
        setupGalleryOpening(stage, items);
        bindGallerySwipe(stage);
        return section;
      }

      function renderLocation() {
        const section = sectionShell('location', 'Location', '오시는 길');
        const body = sectionBody(section);
        const address = element('p', 'location-address', WEDDING_CONFIG.wedding.venue);
        address.append(element('span', 'location-hall', WEDDING_CONFIG.wedding.hall), element('br'), document.createTextNode(WEDDING_CONFIG.wedding.address));
        body.append(address);
        if (String(WEDDING_CONFIG.wedding.address || '').trim()) {
          const copyAddress = element('button', 'address-copy-button', '주소 복사');
          copyAddress.type = 'button';
          copyAddress.dataset.copyAddress = WEDDING_CONFIG.wedding.address;
          body.append(copyAddress);
        }
        if (String(WEDDING_CONFIG.wedding.phone || '').trim()) {
          const phone = element('a', 'venue-phone', WEDDING_CONFIG.wedding.phone);
          phone.href = WeddingUtils.telHref(WEDDING_CONFIG.wedding.phone);
          phone.setAttribute('aria-label', `${WEDDING_CONFIG.wedding.venue}에 전화하기`);
          body.append(phone);
        }
        const map = mediaFrame(WEDDING_CONFIG.media.map, `${WEDDING_CONFIG.wedding.venue} 약도`, 'Map Preview');
        map.classList.add('map-media');
        body.append(map);
        const links = element('nav', 'navigation-links');
        links.setAttribute('aria-label', '지도 앱으로 길 찾기');
        [['naver', '네이버 지도'], ['kakao', '카카오맵'], ['tmap', '티맵']].forEach(([key, label]) => {
          const url = String(WEDDING_CONFIG.navigation[key] || '').trim();
          if (!url) return;
          const link = element('a', 'nav-link', label);
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          links.append(link);
        });
        if (links.childElementCount) body.append(links);
        return section;
      }

      function renderTransportation() {
        const section = sectionShell('transportation', 'Information', '교통 안내');
        const list = element('div', 'transport-list');
        WEDDING_CONFIG.transportation.forEach(item => {
          const article = element('article', 'transport-item');
          article.append(element('h3', 'transport-title', item.title));
          const lines = WeddingUtils.toLines(item.lines).filter(Boolean).join('\n');

      function renderAccounts() {

      function renderShare() {

        const panel = element('div', 'share-panel');
        panel.append(element('p', 'section-copy', WEDDING_CONFIG.sharing.text));
        const button = element('button', 'share-button', '초대장 공유하기');

      function renderOutro() {
        const section = sectionShell('outro', WEDDING_CONFIG.messages.signature, '함께해 주셔서 감사합니다');
        section.querySelector('.section-title').classList.add('visually-hidden');
        const body = sectionBody(section);

          element('p', 'outro-meta', `${WEDDING_CONFIG.wedding.displayDate}\n${WEDDING_CONFIG.wedding.venue} · ${WEDDING_CONFIG.wedding.hall}`),
